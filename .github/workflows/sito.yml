# Pubblica il gioco su GitHub Pages a ogni aggiornamento della cartella sito/
name: Pubblica il sito
on:
  push:
    branches: [main]
    paths: ["sito/**", ".github/workflows/sito.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - id: deploy
        uses: actions/deploy-pages@v4
