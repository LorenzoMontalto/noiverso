<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a0c">
<meta name="description" content="Noiverso: il gioco di carte del gruppo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone/favicon.png">
<link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noiverso">
<title>Noiverso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Notte in città: asfalto scuro, insegne al neon rosse, oro per le leggendarie.
   Layout: barra in alto con monete e salvataggio, schede di navigazione, una vista alla volta. */
:root {
  --notte: #0d0a0c;
  --asfalto: #17121a;
  --muro: #241b23;
  --linea: #3a2c36;
  --testo: #f4ece8;
  --spento: #a8999e;
  --neon: #ff2e46;
  --neon-alone: rgba(255, 46, 70, .45);
  --oro: #f2c14e;
  --r-comune: #9aa3ad;
  --r-rara: #4c95ff;
  --r-epica: #b866ff;
  --r-leggendaria: var(--oro);
  --r-ultra: #ffe9a8;
  --s-FOR: #ff7a45;
  --s-VEL: #3fd8ff;
  --s-DIF: #7ddc6a;
  --ok: #4fd38a;
  --display: "Bungee", "Impact", "Arial Black", sans-serif;
  --corpo: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --molla: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--notte);
  background-image: radial-gradient(120% 60% at 50% -10%, rgba(255, 46, 70, .16), transparent 60%);
  background-repeat: no-repeat;   /* senza: sulle pagine lunghe la sfumatura si ripeteva a fasce */
  color: var(--testo);
  font: 500 17px/1.45 var(--corpo);
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; display: block; }
button, input { font: inherit; color: inherit; }
h1, h2 { font-family: var(--display); font-weight: 400; letter-spacing: .02em; text-wrap: balance; margin: 0; }
h2 { font-size: 1.35rem; }
:focus-visible { outline: 2px solid var(--oro); outline-offset: 3px; }

#app { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }

/* ---------- Barra in alto ---------- */
.testa { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-size: 1.3rem; color: var(--neon); text-shadow: 0 0 10px var(--neon-alone), 0 0 2px #fff3; margin-right: auto; }
.monete { display: inline-flex; align-items: center; gap: 6px; background: var(--asfalto); border: 1px solid var(--linea); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.monete i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2c4, var(--oro) 55%, #a37812); box-shadow: 0 0 6px rgba(242, 193, 78, .5); }
.monete.sale { animation: sale .6s var(--molla); } .monete.scende { animation: scende .5s; }
.salvataggio { font-size: .82rem; color: var(--spento); display: inline-flex; align-items: center; gap: 6px; }
.salvataggio::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--spento); }
.salvataggio.ok::before { background: var(--ok); }
.salvataggio.locale::before { background: var(--oro); }
.salvataggio.in-corso::before { background: var(--testo); animation: pulsa 1s infinite; }

.nav { position: relative; display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--linea); margin-bottom: 24px; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav button { position: relative; background: none; border: 0; padding: 10px 13px; color: var(--spento); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: .85rem; cursor: pointer; white-space: nowrap; transition: color .2s; }
.nav button[aria-current="page"] { color: var(--testo); }
.nav button:hover { color: var(--testo); }
.nav-indicatore { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--neon); box-shadow: 0 0 10px var(--neon); border-radius: 3px 3px 0 0; transition: transform .45s var(--molla), width .35s ease; }
.badge { position: absolute; top: 3px; right: 0; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--neon); color: #fff; font-size: .68rem; line-height: 17px; text-align: center; letter-spacing: 0; animation: pulsa-badge 2s infinite; }
.badge[hidden] { display: none; }
[data-vista="pass"] .badge { background: var(--oro); color: #1b1206; }
.in-battaglia .nav { opacity: .35; pointer-events: none; }

#vista.vista-entra > * { animation: vista-entra .45s cubic-bezier(.2, .8, .2, 1) both; }

/* ---------- Bottoni ---------- */
.btn { position: relative; overflow: hidden; background: var(--muro); border: 1px solid var(--linea); border-radius: 10px; padding: 11px 18px; font-weight: 700; cursor: pointer; transition: transform .12s, border-color .15s, background .15s, box-shadow .2s; }
.btn:hover:not(:disabled) { border-color: var(--spento); transform: translateY(-1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primario { background: var(--neon); border-color: var(--neon); color: #fff; box-shadow: 0 0 18px var(--neon-alone); }
.btn.primario:hover:not(:disabled) { background: #ff4a5f; border-color: #ff4a5f; box-shadow: 0 0 28px var(--neon-alone); }
.btn.oro { background: linear-gradient(135deg, #f7d77e, var(--oro) 50%, #c8921f); border-color: var(--oro); color: #1b1206; box-shadow: 0 0 18px rgba(242, 193, 78, .45); }
.btn.oro:not(:disabled) { animation: brilla-oro 2.4s infinite; }
.btn.piccolo { padding: 6px 12px; font-size: .88rem; }
.azioni { display: flex; gap: 10px; flex-wrap: wrap; }
.azioni.centro { justify-content: center; }
.nota { color: var(--spento); margin: 6px 0 16px; max-width: 65ch; }
.onda { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .45); transform: scale(0); animation: onda .6s ease-out; pointer-events: none; }

/* Animazioni al click, una diversa per tipo di bottone */
.fx-schiaccia { animation: schiaccia .38s var(--molla); }
.fx-colpo { animation: colpo-btn .35s ease-out; }
.fx-carica { animation: carica-btn .6s ease-out; }
.fx-gelatina { animation: gelatina .55s; }
.fx-scuoti { animation: scuoti .45s; }
.fx-spinta { animation: spinta .35s ease-out; }
.fx-gira { animation: gira-y .5s var(--molla); }
.fx-salto { animation: salto .45s var(--molla); }
.rimbalza { animation: rimbalza .5s var(--molla); }

/* ---------- Carta ---------- */
.carta { --rc: var(--r-comune); position: relative; aspect-ratio: 5 / 7; border-radius: 12px; overflow: hidden; background: var(--asfalto);
  border: 2px solid var(--rc); box-shadow: 0 6px 20px rgba(0, 0, 0, .5); user-select: none; isolation: isolate; }
.carta.r-rara { --rc: var(--r-rara); }
.carta.r-epica { --rc: var(--r-epica); box-shadow: 0 6px 20px rgba(0, 0, 0, .5), 0 0 14px rgba(184, 102, 255, .35); }
.carta.r-leggendaria { --rc: var(--r-leggendaria); box-shadow: 0 6px 20px rgba(0, 0, 0, .5), 0 0 18px rgba(242, 193, 78, .45); }
.carta.r-leggendaria::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255, 240, 200, .28) 45%, transparent 60%);
  background-size: 250% 100%; animation: luccica 4.5s infinite linear; pointer-events: none; mix-blend-mode: screen; }
.carta img { width: 100%; height: 100%; object-fit: cover; }
.carta[role=button] { cursor: pointer; transition: transform .2s var(--molla); }
.carta[role=button]:hover { transform: translateY(-4px) rotate(-1deg); }
.carta-testa { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: center; }
.liv { background: rgba(13, 10, 12, .8); border: 1px solid var(--rc); border-radius: 6px; padding: 0 6px; font-size: .78rem; font-weight: 700; }
.liv.lode { background: linear-gradient(135deg, #fff1bd, var(--oro) 55%, #c8921f); color: #1b1206; border-color: #fff3c4; box-shadow: 0 0 10px rgba(242, 193, 78, .8); }
.carta-xp { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 3px; border-radius: 2px; background: rgba(0, 0, 0, .55); overflow: hidden; z-index: 2; }
.carta-xp i { display: block; height: 100%; background: var(--s-VEL); }
.carta-xp.verso-lode i { background: var(--oro); } .carta-xp.piena i { background: linear-gradient(90deg, #fff1bd, var(--oro)); box-shadow: 0 0 6px var(--oro); }
.livello-box { background: var(--muro); border-radius: 12px; padding: 10px 14px; display: grid; gap: 6px; }
.livello-box.lode { border: 1px solid var(--oro); box-shadow: 0 0 16px rgba(242, 193, 78, .3); }
.livello-riga { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.livello-riga span { color: var(--spento); }
.livello-box .nota { margin: 0; }
.livello-box.sale { animation: livello-sale .9s var(--molla); }
@keyframes livello-sale { 0% { box-shadow: 0 0 0 0 rgba(63, 216, 255, .9); transform: scale(1); } 30% { transform: scale(1.04); } 100% { box-shadow: 0 0 0 22px rgba(63, 216, 255, 0); transform: scale(1); } }
.xp-barra.pot i { background: linear-gradient(90deg, #6fe3a0, #3fd8ff); }
.potenzia-riga { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.potenzia-riga .costi { display: flex; gap: 12px; flex-wrap: wrap; font-weight: 600; font-variant-numeric: tabular-nums; }
.potenzia-riga .ok { color: #6fe3a0; } .potenzia-riga .manca { color: #ff6b7a; }
.potenzia-riga .btn[disabled] { opacity: .45; cursor: not-allowed; }
.prossimo { font-size: .82rem; color: var(--spento); margin: 0; font-variant-numeric: tabular-nums; }
.prossimo b { color: #6fe3a0; }
.potenziabile { position: absolute; top: 34px; right: 6px; z-index: 3; display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px 0 6px; border-radius: 11px; font-size: .72rem; font-weight: 800; line-height: 1; color: #08130d; background: #6fe3a0; box-shadow: 0 0 0 2px rgba(8, 19, 13, .55), 0 0 14px rgba(111, 227, 160, .85); animation: pot-pulsa 1.4s ease-in-out infinite; white-space: nowrap; }
.potenziabile b { font-size: .8rem; } .potenziabile em { font-style: normal; text-transform: uppercase; letter-spacing: .02em; }
.potenziabile.manca { background: #ffb347; box-shadow: 0 0 0 2px rgba(20, 10, 0, .55); animation: none; color: #2a1400; }
.potenziabile.manca em { text-transform: none; }
.carta.piccola .potenziabile, .slot .potenziabile { top: 26px; right: 4px; height: 18px; padding: 0 6px; font-size: .62rem; }
.carta.mini .potenziabile { display: none; }
.potenziabile.ascesa-pronta { background: linear-gradient(135deg, #ffd76a, #ff9bd2); box-shadow: 0 0 0 2px rgba(30, 10, 20, .55), 0 0 14px rgba(255, 190, 120, .85); color: #2a0c18; }
.carta .ascesa-tag { position: absolute; left: 6px; bottom: 58px; z-index: 3; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 900; color: #1a0d05; background: var(--rc, #ffd76a); box-shadow: 0 0 0 2px rgba(0, 0, 0, .5), 0 0 10px var(--rc, #ffd76a); }
.carta.piccola .ascesa-tag { width: 18px; height: 18px; font-size: .64rem; bottom: 44px; left: 4px; }
.ascesa-box { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rc, #ffd76a); background: linear-gradient(135deg, rgba(255, 215, 106, .1), rgba(255, 155, 210, .08)); }
.ascesa-box.r-rara { --rc: var(--r-rara); } .ascesa-box.r-epica { --rc: var(--r-epica); } .ascesa-box.r-leggendaria { --rc: var(--r-leggendaria); }
.ascesa-box > b { color: var(--rc); } .ascesa-box p { margin: 6px 0 8px; font-size: .9rem; opacity: .9; }
.ascesa-carte { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0; }
.ascesa-carte .carta { width: 150px; }
.ascesa-tab { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: .88rem; }
.ascesa-tab th, .ascesa-tab td { padding: 5px 8px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.st-scorri { overflow: auto; max-height: 560px; margin-top: 8px; }
.st-tabella thead th { position: sticky; top: 0; background: #17121a; z-index: 1; }
.st-tabella { width: 100%; border-collapse: collapse; font-size: .84rem; white-space: nowrap; }
.st-tabella th, .st-tabella td { padding: 5px 8px; border-bottom: 1px solid rgba(255, 255, 255, .07); text-align: right; }
.st-tabella th:first-child, .st-tabella td.st-nome { text-align: left; } .st-tabella td small { opacity: .6; }
.st-ordina { background: none; border: 0; color: inherit; font: inherit; font-weight: 600; opacity: .7; cursor: pointer; padding: 0; } .st-ordina.attivo { opacity: 1; color: var(--accento, #ff2e46); }
.st-forte { color: #ff6b6b; font-weight: 700; } .st-debole { color: #5aa9ff; font-weight: 700; } .st-poche { opacity: .45; } .st-vuota { opacity: .3; }
.tipo-bollino { display: inline-grid; place-items: center; width: 14px; height: 14px; margin-left: 4px; line-height: 1; border-radius: 50%; font-size: .62rem; font-style: normal; font-weight: 900; vertical-align: middle; }
.tipo-bollino.su { background: #2fbf71; color: #062; } .tipo-bollino.giu { background: #ff4d5e; color: #400; }
.tipo-nota { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: .78em; font-weight: 800; white-space: nowrap; vertical-align: 1px; } .tipo-nota.su { background: #2fbf7133; color: #6ee7a5; } .tipo-nota.giu { background: #ff4d5e33; color: #ff9aa5; }
.boss-danni { font-size: 1.05rem; } .boss-danni b { font-size: 1.4rem; color: var(--oro, #f2c14e); }
.pieta-riga { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; padding: 9px 12px; border-radius: 10px; background: rgba(242, 193, 78, .08); border: 1px solid rgba(242, 193, 78, .25); font-size: .9rem; }
.pieta-barra { flex: 1 1 120px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; } .pieta-barra i { display: block; height: 100%; width: var(--p); background: var(--r-leggendaria); }
.ascesa-tab th { font-weight: 600; opacity: .75; font-size: .78rem; } .ascesa-tab td:first-child { text-align: left; opacity: .8; }
.potenziabile.finto { position: static; animation: none; vertical-align: middle; margin: 0 4px 0 10px; }
.potenziabile.finto:first-child { margin-left: 0; }
.legenda-pot { margin: 4px 0 8px; font-size: .8rem; color: var(--spento); line-height: 1.9; }
.chip.chip-pot { border-color: #6fe3a0; color: #6fe3a0; font-weight: 800; }
.chip.chip-pot[aria-pressed="true"] { background: #6fe3a0; color: #08130d; }
.btn.btn-pot { background: #6fe3a0; color: #08130d; border-color: #6fe3a0; font-weight: 800; }
.pot-mancano { align-self: center; }
.copertina.copertina-pot { --c: #6fe3a0; border-color: #6fe3a0; }
.copertina-pot .pot-grande { display: block; font-size: 1.8rem; color: #6fe3a0; text-shadow: 0 0 14px rgba(111, 227, 160, .8); }
.sezione-pot { --c: #6fe3a0; }
@keyframes pot-pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
.esp-barra.pot i { background: linear-gradient(90deg, #6fe3a0, #3fd8ff); }
.esp-carte { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.esp-carta { position: relative; width: 62px; display: grid; gap: 3px; justify-items: center; animation: cella-entra .5s var(--molla) both; animation-delay: calc(.3s + var(--i) * 90ms); }
.esp-carta img { width: 52px; aspect-ratio: 5 / 7; object-fit: cover; border-radius: 6px; border: 2px solid var(--linea); }
.esp-carta.su img { border-color: var(--s-VEL); box-shadow: 0 0 12px rgba(63, 216, 255, .7); }
.esp-carta.lode img { border-color: var(--oro); box-shadow: 0 0 16px rgba(242, 193, 78, .9); animation: brilla-oro 1.5s infinite; }
.esp-liv { position: absolute; top: -6px; right: -4px; font-size: .62rem; font-weight: 700; background: var(--muro); border: 1px solid var(--linea); border-radius: 5px; padding: 0 4px; }
.esp-barra { width: 100%; height: 4px; background: var(--muro); border-radius: 2px; overflow: hidden; }
.esp-barra i { display: block; height: 100%; width: var(--p); background: var(--s-VEL); animation: riempi 1s cubic-bezier(.2, .8, .2, 1) both .6s; }
.esp-carta small { font-size: .68rem; font-weight: 700; color: var(--spento); } .esp-carta.su small { color: var(--s-VEL); } .esp-carta.lode small { color: var(--oro); }
.carta-piede { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 10px 9px; background: linear-gradient(transparent, rgba(8, 6, 8, .94) 42%); }
.carta-nome { font-family: var(--display); font-size: 1.02rem; line-height: 1.1; }
.carta-sotto { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.ruolo-tag { background: var(--rc); color: #120c10; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; }
.ruolo-cosa { font-size: .74rem; color: #d9cdd1; }
.carta.piccola .carta-nome { font-size: .8rem; }
.carta.piccola .ruolo-tag { font-size: .62rem; }
.carta.sconosciuta { border-color: var(--linea); box-shadow: none; }
.carta.sconosciuta img { filter: brightness(0); opacity: .9; }
.punto-domanda { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 2.6rem; color: var(--linea); }
.stile { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .06em; padding: 1px 6px; border-radius: 5px; background: rgba(13, 10, 12, .8); border: 1px solid currentColor; }
.s-FOR { color: var(--s-FOR); } .s-VEL { color: var(--s-VEL); } .s-DIF { color: var(--s-DIF); }
.cella { animation: cella-entra .35s var(--molla) both; animation-delay: calc(min(var(--i, 0), 10) * 20ms); }

/* ---------- Home ---------- */
.eroe { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center; margin-bottom: 28px; }
.neon { color: var(--neon); text-shadow: 0 0 6px #fff4, 0 0 16px var(--neon-alone), 0 0 40px var(--neon-alone); }
h1.neon { font-size: clamp(2.6rem, 8vw, 4.6rem); line-height: .95; margin-bottom: 14px; animation: accendi 1.4s ease-out both; }
.eroe p { max-width: 46ch; color: var(--spento); font-size: 1.08rem; margin: 0 0 20px; }
.ventaglio { position: relative; height: 300px; perspective: 900px; }
.ventaglio .carta { position: absolute; width: 150px; top: 20px; left: 50%; transform-origin: 50% 120%; animation: ventaglio-apri .9s var(--molla) both; }
.ventaglio .carta:nth-child(1) { --r: -24deg; animation-delay: .05s; }
.ventaglio .carta:nth-child(2) { --r: -12deg; animation-delay: .12s; }
.ventaglio .carta:nth-child(3) { --r: 0deg; z-index: 2; animation-delay: .19s; }
.ventaglio .carta:nth-child(4) { --r: 12deg; animation-delay: .26s; }
.ventaglio .carta:nth-child(5) { --r: 24deg; animation-delay: .33s; }
.riquadri { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
.riquadro { background: var(--asfalto); border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.riquadro span { color: var(--spento); font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.riquadro b { font-size: 1.7rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.riquadro small { font-size: .95rem; color: var(--spento); font-weight: 500; }
.barra { height: 6px; background: var(--muro); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.barra i { display: block; height: 100%; width: var(--p); background: var(--neon); animation: riempi 1s cubic-bezier(.2, .8, .2, 1) both .2s; }
.barra.oro i { background: var(--oro); }
.regole { background: var(--asfalto); border: 1px solid var(--linea); border-radius: 14px; padding: 20px 22px; }
.regole ol { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 8px; max-width: 75ch; }
.regole li { color: var(--spento); } .regole li b { color: var(--testo); }

/* ---------- Edicola ---------- */
.scaffale { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; margin-bottom: 28px; }
.bustina-box { background: var(--asfalto); border: 1px solid var(--linea); border-radius: 16px; padding: 18px; display: grid; gap: 8px; justify-items: center; text-align: center; }
.bustina-box .nota { margin: 0; }
.bustina-3d { --c: var(--neon); --rx: 0deg; --ry: 0deg; width: 130px; aspect-ratio: 5 / 7; perspective: 600px; margin-bottom: 6px; }
.bustina-faccia { width: 100%; height: 100%; border-radius: 10px; border: 2px solid var(--c); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 8px, transparent 8px 16px), linear-gradient(160deg, color-mix(in srgb, var(--c) 30%, #120c10), #120c10 60%);
  box-shadow: 0 0 24px color-mix(in srgb, var(--c) 45%, transparent), inset 0 0 30px rgba(0, 0, 0, .6);
  transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .2s; animation: fluttua 3.2s ease-in-out infinite; position: relative; overflow: hidden; }
.bustina-faccia::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%); background-size: 250% 100%; animation: luccica 3s infinite linear; }
.bustina-faccia span { font-family: var(--display); color: var(--c); text-shadow: 0 0 12px var(--c); font-size: 1.3rem; line-height: 1; }
.bustina-faccia small { color: var(--spento); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; font-size: .7rem; }
.b-epica { --c: var(--r-epica); } .b-leggendaria { --c: var(--oro); } .b-benvenuto { --c: #ff6b7d; }
.bustina-3d.spenta .bustina-faccia { animation: none; filter: saturate(.6); }
.probabilita { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 300px; }
.probabilita caption { text-align: left; color: var(--spento); font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-bottom: 6px; }
.probabilita th, .probabilita td { text-align: left; padding: 6px 16px 6px 0; border-bottom: 1px solid var(--linea); }
.probabilita th { color: var(--spento); font-weight: 600; font-size: .85rem; }
.pallino { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; background: var(--r-comune); }
.pallino.r-rara { background: var(--r-rara); } .pallino.r-epica { background: var(--r-epica); } .pallino.r-leggendaria { background: var(--r-leggendaria); }

/* ---------- Apertura 3D ---------- */
#apertura { position: fixed; inset: 0; z-index: 25; background: radial-gradient(80% 70% at 50% 45%, #2a0f18, #07050a 75%); animation: dissolvi .3s ease-out; }
#apertura[hidden] { display: none; }
.apertura-tela { position: absolute; inset: 0; }
.apertura-tela canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
.apertura-ui { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px max(20px, env(safe-area-inset-bottom)); display: grid; gap: 10px; justify-items: center; pointer-events: none; }
.apertura-ui > * { pointer-events: auto; }
.suggerimento { margin: 0; font-family: var(--display); font-size: 1.1rem; color: var(--testo); text-shadow: 0 0 12px var(--neon-alone); animation: respira 1.8s ease-in-out infinite; min-height: 1.4em; }
/* riserva 2D */
.apertura2d { text-align: center; }
.apertura2d h2 { margin-bottom: 18px; }
.apertura-carte { display: grid; grid-template-columns: repeat(5, minmax(0, 150px)); gap: 12px; justify-content: center; margin-bottom: 20px; }
.gira { position: relative; aspect-ratio: 5 / 7; background: none; border: 0; padding: 0; cursor: pointer; perspective: 900px; }
.faccia { position: absolute; inset: 0; backface-visibility: hidden; transition: transform .6s cubic-bezier(.2, .8, .2, 1); border-radius: 12px; }
.retro { display: grid; place-items: center; border: 2px solid var(--neon); background: repeating-linear-gradient(135deg, #1b1218 0 10px, #22161e 10px 20px); }
.retro span { font-family: var(--display); font-size: 1.8rem; }
.fronte { transform: rotateY(180deg); }
.gira.girata .retro { transform: rotateY(-180deg); }
.gira.girata .fronte { transform: rotateY(0); }
.etichetta { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); background: var(--neon); color: #fff; font-weight: 700; font-size: .78rem; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.etichetta:empty { display: none; }

/* ---------- Album / Squadre ---------- */
.titolo-riga { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.titolo-riga.piccola { margin: 22px 0 10px; align-items: center; }
.titolo-riga .nota { margin: 0; }
.filtri { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--asfalto); border: 1px solid var(--linea); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; transition: border-color .2s, background .2s; }
.chip[aria-pressed="true"] { border-color: var(--neon); color: var(--testo); background: #2a1219; }
.griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.squadra-barra { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.squadra-barra label { color: var(--spento); font-weight: 600; font-size: .9rem; }
.squadra-barra input { background: var(--asfalto); border: 1px solid var(--linea); border-radius: 10px; padding: 8px 12px; min-width: 200px; }
.squadra-barra input:focus { border-color: var(--neon); outline: none; box-shadow: 0 0 0 3px var(--neon-alone); }
.squadra-barra .nota { margin: 0; }
.slot5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; max-width: 820px; }
.slot5.piccola { max-width: 560px; gap: 8px; margin-bottom: 20px; }
.slot { position: relative; display: grid; gap: 6px; }
.slot.pieno { animation: cella-entra .45s var(--molla) both; animation-delay: calc(var(--i) * 40ms); }
.slot-vuoto { aspect-ratio: 5 / 7; border: 2px dashed var(--linea); border-radius: 12px; display: grid; place-items: center; color: var(--spento); font-weight: 600; font-size: .9rem; }
.slot-comandi { display: flex; justify-content: center; gap: 4px; }
.mini-btn { background: var(--muro); border: 1px solid var(--linea); border-radius: 8px; width: 32px; height: 30px; cursor: pointer; font-size: .8rem; display: grid; place-items: center; }
.mini-btn:disabled { opacity: .3; cursor: default; }
.mini-btn.togli:hover { border-color: var(--neon); color: var(--neon); }
.primo { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--neon); color: #fff; font-size: .66rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; z-index: 2; }
.riepilogo { display: flex; gap: 22px; flex-wrap: wrap; background: var(--asfalto); border: 1px solid var(--linea); border-radius: 12px; padding: 12px 16px; }
.riepilogo > div { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.riepilogo span { color: var(--spento); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-right: 4px; }
.ruolo-pill { font-size: .8rem; background: var(--muro); border-radius: 5px; padding: 1px 7px; }
.scegli { border-radius: 14px; cursor: pointer; position: relative; transition: transform .2s var(--molla); }
.scegli:hover { transform: translateY(-4px); }
.scegli.scelta { outline: 3px solid var(--neon); outline-offset: 3px; }
.scegli.scelta::after { content: "In squadra"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: 2; white-space: nowrap; background: var(--neon); color: #fff; font-weight: 700; font-size: .8rem; padding: 3px 10px; border-radius: 999px; }
.vuoto { text-align: center; padding: 48px 16px; display: grid; justify-items: center; gap: 14px; }
.vuoto p { color: var(--spento); max-width: 50ch; margin: 0; }

/* ---------- Sfida ---------- */
.livelli { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; perspective: 1000px; }
.livello { --rx: 0deg; --ry: 0deg; --lx: 50%; position: relative; overflow: hidden; text-align: left; background: var(--asfalto); border: 1px solid var(--linea); border-radius: 16px; padding: 18px 18px 18px 18px; cursor: pointer; display: grid; gap: 6px;
  transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .15s, border-color .2s, box-shadow .2s; animation: cella-entra .5s var(--molla) both; animation-delay: calc(var(--i) * 70ms); }
.livello::before { content: ""; position: absolute; inset: 0; background: radial-gradient(200px circle at var(--lx) 0%, rgba(255, 46, 70, .18), transparent 60%); opacity: 0; transition: opacity .2s; pointer-events: none; }
.livello:hover { border-color: var(--neon); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
.livello:hover::before { opacity: 1; }
.livello b { font-family: var(--display); font-weight: 400; font-size: 1.25rem; }
.livello span { color: var(--spento); }
.livello small { color: var(--oro); font-weight: 600; }
.livello-num { position: absolute; right: 14px; top: 6px; font-family: var(--display); font-size: 2.6rem; color: var(--linea) !important; line-height: 1; }
.l-leggenda { border-color: rgba(242, 193, 78, .4); }

/* ---------- Pass battaglia ---------- */
.pass-testa { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; margin-bottom: 8px; }
.pass-stemma { position: relative; width: 96px; height: 96px; display: grid; place-items: center; }
.pass-stemma span { position: relative; font-family: var(--display); font-size: 2.4rem; color: var(--oro); text-shadow: 0 0 16px rgba(242, 193, 78, .7); }
.stemma-giro { position: absolute; inset: 0; border-radius: 22px; background: conic-gradient(from 0deg, var(--oro), var(--neon), var(--s-VEL), var(--oro)); animation: ruota 6s linear infinite; }
.stemma-giro::after { content: ""; position: absolute; inset: 4px; border-radius: 18px; background: var(--notte); }
.pass-info h2 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 2px 0 8px; }
.serie-nome { margin: 0 0 2px; color: var(--spento); text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; font-weight: 600; }
.xp { display: grid; gap: 4px; max-width: 460px; }
.xp small { color: var(--spento); font-variant-numeric: tabular-nums; }
.xp-barra { position: relative; height: 14px; border-radius: 7px; background: var(--muro); overflow: hidden; border: 1px solid var(--linea); }
.xp-barra i { position: absolute; inset: 0 auto 0 0; width: var(--p); background: linear-gradient(90deg, #c8921f, var(--oro), #fff1bd); border-radius: 7px; animation: riempi 1.2s cubic-bezier(.2, .8, .2, 1) both .2s; box-shadow: 0 0 12px rgba(242, 193, 78, .6); }
.xp-barra i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .7), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: scorre 1.8s infinite; }
.pass-pista { position: relative; overflow-x: auto; overflow-y: hidden; border-radius: 18px; border: 1px solid var(--linea); padding: 0; scroll-behavior: smooth;
  background: linear-gradient(#0a0610, #1a0c16 55%, #120a10); scrollbar-color: var(--neon) transparent; isolation: isolate; }
.pista-cielo { position: absolute; z-index: 0; left: 0; bottom: 62px; width: 9000px; height: 230px; pointer-events: none; will-change: transform; opacity: .8; }
.pista-cielo svg { width: 100%; height: 100%; }
.pista-cielo .palazzi { fill: #1e1019; } .pista-cielo .finestre { fill: #ffcf6a; opacity: .35; animation: finestre 4s steps(2) infinite; }
.pista { --w: 136px; position: relative; z-index: 1; display: grid; grid-auto-flow: column; grid-auto-columns: var(--w); padding: 34px 40px 22px; width: max-content; }
.strada { position: absolute; left: 40px; right: 40px; bottom: 40px; height: 10px; border-radius: 5px; background: repeating-linear-gradient(90deg, #3a2c36 0 24px, #2a2028 24px 48px); box-shadow: 0 0 0 1px #000 inset; }
.strada-luce { position: absolute; inset: 0 auto 0 0; width: 0; transition: width 1.2s cubic-bezier(.2, .8, .2, 1); border-radius: 5px; background: linear-gradient(90deg, var(--neon), var(--oro)); box-shadow: 0 0 16px var(--neon), 0 0 30px rgba(242, 193, 78, .5); animation: riempi 1.6s cubic-bezier(.2, .8, .2, 1) both .3s; }
.strada-luce::after { content: ""; position: absolute; inset: -3px 0; background: repeating-linear-gradient(90deg, transparent 0 30px, rgba(255, 255, 255, .7) 30px 36px); animation: corsia 1s linear infinite; mix-blend-mode: screen; border-radius: 5px; }
.nodo { position: relative; display: grid; justify-items: center; gap: 12px; animation: nodo-entra .6s var(--molla) both; animation-delay: calc(var(--i) * 30ms); }
.premio { --rx: 0deg; --ry: 0deg; position: relative; width: 112px; height: 132px; border-radius: 14px; border: 1px solid var(--linea); background: linear-gradient(170deg, #2a1d27, #17121a);
  display: grid; justify-items: center; align-content: center; gap: 6px; padding: 8px; cursor: default; transform: perspective(600px) rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .15s, box-shadow .2s; }
.premio-testo { font-size: .82rem; font-weight: 700; text-align: center; line-height: 1.15; }
.premio-stato { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--spento); }
.nodo.bloccato .premio { filter: grayscale(.8) brightness(.65); }
.nodo.pronto .premio { border-color: var(--oro); cursor: pointer; box-shadow: 0 0 22px rgba(242, 193, 78, .45); animation: fluttua 2.2s ease-in-out infinite; }
.nodo.pronto .premio-stato { color: var(--oro); }
.nodo.preso .premio { opacity: .55; }
.nodo.preso .premio::after { content: "✓"; position: absolute; top: 6px; right: 8px; color: var(--ok); font-weight: 700; }
.nodo.grande .premio { width: 120px; height: 146px; margin-top: -14px; }
.nodo.prossimo .premio { border-style: dashed; border-color: var(--spento); }
.nodo.riscosso-ora .premio { animation: riscatto .7s var(--molla) forwards; }
.nodo-punto { width: 30px; height: 30px; border-radius: 50%; background: var(--muro); border: 2px solid var(--linea); display: grid; place-items: center; font-size: .78rem; font-weight: 700; position: relative; z-index: 1; margin-top: 2px; }
.nodo.pronto .nodo-punto, .nodo.preso .nodo-punto { background: var(--neon); border-color: #fff4; box-shadow: 0 0 12px var(--neon); }
.ico-monete { position: relative; width: 46px; height: 40px; }
/* premi a scelta ogni 10 livelli */
.nodo.scelta { grid-column: span 2; }
.premio-doppio { position: relative; width: 252px; height: 158px; margin-top: -20px; border-radius: 16px; border: 1px solid var(--linea); background: linear-gradient(170deg, #34233a, #17121a); padding: 8px; display: grid; grid-template-rows: auto 1fr; gap: 6px; }
.nodo.scelta.pronto .premio-doppio { border-color: var(--oro); box-shadow: 0 0 26px rgba(242, 193, 78, .55); animation: fluttua 2.2s ease-in-out infinite; }
.nodo.scelta.bloccato .premio-doppio { filter: grayscale(.7) brightness(.7); }
.scegli-tit { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--oro); text-align: center; }
.opzioni { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 4px; }
.oppure { align-self: center; font-style: normal; font-family: var(--display); color: var(--spento); font-size: .8rem; }
.opzione { display: grid; justify-items: center; align-content: center; gap: 6px; padding: 6px 4px; border-radius: 12px; border: 1px solid var(--linea); background: rgba(255, 255, 255, .03); cursor: default; }
.opzione .premio-testo { font-size: .74rem; }
.nodo.scelta.pronto .opzione { cursor: pointer; border-color: rgba(242, 193, 78, .5); }
.nodo.scelta.pronto .opzione:hover { background: rgba(242, 193, 78, .12); transform: translateY(-2px); }
.opzione.scelta-fatta { border-color: var(--ok); background: rgba(79, 211, 138, .12); }
.opzione.scartata { opacity: .3; filter: grayscale(1); }
.ico-pot { width: 42px; height: 46px; display: grid; place-items: center; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(160deg, #9dffc0, #3fd8ff); }
.ico-pot b { font-family: var(--display); font-weight: 400; font-size: .78rem; color: #06140c; }
/* scrigno a sorpresa dopo il 100 */
.nodo.bonus { grid-column: span 2; }
.premio-bonus { width: 230px; min-height: 158px; margin-top: -20px; border-radius: 16px; border: 2px dashed var(--linea); background: radial-gradient(circle at 50% 20%, #3a2a10, #17121a 70%); padding: 10px; display: grid; justify-items: center; gap: 5px; text-align: center; }
.premio-bonus small { color: var(--spento); font-size: .72rem; }
.premio-bonus .xp-barra { width: 100%; height: 8px; }
.nodo.bonus.pronto .premio-bonus, .nodo.bonus.attesa .premio-bonus { border-style: solid; border-color: var(--oro); box-shadow: 0 0 26px rgba(242, 193, 78, .45); }
.nodo.bonus.bloccato .premio-bonus { filter: grayscale(.7) brightness(.7); }
.scrigno-ico { position: relative; width: 52px; height: 40px; border-radius: 6px 6px 8px 8px; background: linear-gradient(#a0662a, #6a3c14); border: 2px solid var(--oro); display: grid; place-items: center; }
.scrigno-ico i { position: absolute; left: -2px; right: -2px; top: -12px; height: 16px; border-radius: 10px 10px 2px 2px; background: linear-gradient(#c88a3a, #8a5420); border: 2px solid var(--oro); transform-origin: 0 100%; }
.scrigno-ico b { font-family: var(--display); color: #fff1bd; text-shadow: 0 0 8px var(--oro); font-size: 1rem; position: relative; top: 2px; }
.nodo.bonus.pronto .scrigno-ico { animation: scrigno-salta 1.2s ease-in-out infinite; }
@keyframes scrigno-salta { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-6px) rotate(-6deg); } 60% { transform: translateY(0) rotate(5deg); } }
.bonus-rivela { text-align: center; display: grid; gap: 8px; justify-items: center; padding: 6px 4px; }
.scrigno-grande { position: relative; height: 200px; display: grid; place-items: end center; width: 220px; }
.scrigno-grande .scrigno-ico { transform: scale(2); transform-origin: 50% 100%; margin-bottom: 12px; }
.scrigno-ico.aperto i { animation: coperchio .6s var(--molla) forwards; }
@keyframes coperchio { to { transform: rotate(-38deg) translate(-2px, -2px); } }
.bonus-premio { position: absolute; left: 50%; bottom: 60px; z-index: 2; display: grid; place-items: center; transform: translateX(-50%); animation: bonus-sale .9s var(--molla) .25s both; filter: drop-shadow(0 0 16px var(--oro)); }
@keyframes bonus-sale { from { opacity: 0; transform: translate(-50%, 50px) scale(.4); } to { opacity: 1; transform: translate(-50%, -48px) scale(1.7); } }
/* scelta della carta per i potenziatori */
.scelta-pot { display: grid; gap: 8px; }
.griglia-pot { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; max-height: 60vh; overflow-y: auto; padding: 2px; }
.pot-carta { display: grid; gap: 4px; justify-items: center; background: none; border: 2px solid transparent; border-radius: 12px; padding: 4px; cursor: pointer; }
.pot-carta:hover { border-color: #6fe3a0; }
.pot-carta.in-squadra { border-color: rgba(63, 216, 255, .4); }
.pot-carta small { font-size: .72rem; color: var(--spento); font-variant-numeric: tabular-nums; }
.oro-testo { color: var(--oro); }
.ico-monete i { position: absolute; left: 6px; width: 34px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #fff2c4, var(--oro) 55%, #a37812); box-shadow: 0 2px 0 #8a6410; }
.ico-monete i:nth-child(1) { bottom: 0; } .ico-monete i:nth-child(2) { bottom: 9px; } .ico-monete i:nth-child(3) { bottom: 18px; left: 9px; }
.ico-bustina { --c: var(--neon); position: relative; width: 38px; height: 52px; border-radius: 5px; border: 2px solid var(--c); background: linear-gradient(160deg, color-mix(in srgb, var(--c) 35%, #120c10), #120c10); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent); }
.ico-bustina em { position: absolute; right: -14px; bottom: -6px; font-style: normal; font-family: var(--display); font-size: .8rem; color: var(--c); }
.ico-bustina.b-epica { --c: var(--r-epica); } .ico-bustina.b-leggendaria { --c: var(--oro); }

.banner-agg { position: fixed; z-index: 60; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(620px, calc(100% - 24px)); display: flex; gap: 12px; align-items: center; justify-content: space-between;
  background: rgba(22, 17, 21, .96); border: 1px solid var(--oro); border-radius: 14px; padding: 10px 14px; box-shadow: 0 10px 40px rgba(0, 0, 0, .6); animation: cella-entra .4s var(--molla); }
.banner-agg span { font-size: .9rem; }
.scelta-account { margin: 6px 0 12px; } .scelta-account .seg { flex: 1; }
.errore-form { color: #ff6b7a; font-weight: 600; margin: 6px 0 0; font-size: .9rem; }
#form-account input { width: 100%; }
/* ---------- Arena (a tutto schermo) ---------- */
/* Telefono: in alto il campo (nemico in alto a destra, tu in basso a sinistra), sotto i comandi.
   Schermo largo: il campo occupa tutto lo schermo e i comandi stanno in basso a destra, sopra al campo. */
body.in-battaglia { overflow: hidden; }
.in-battaglia .testa, .in-battaglia .nav { display: none; }
.arena { position: fixed; inset: 0; z-index: 15; background: #07050a; display: flex; flex-direction: column; overflow: hidden; animation: dissolvi .35s ease-out;
  padding-bottom: env(safe-area-inset-bottom); }

/* Cut-in delle mosse finali */

/* ---------- Classifica ---------- */

/* ---------- Negozio e codici ---------- */
