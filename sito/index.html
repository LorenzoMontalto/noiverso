.missione { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.missione-testo { display: grid; gap: 1px; }
.missione-testo b { font-size: .92rem; font-weight: 600; }
.missione-testo small { color: var(--spento); font-size: .76rem; }
.missione-barra { grid-column: 1; position: relative; height: 16px; border-radius: 999px; background: var(--notte); border: 1px solid var(--linea); overflow: hidden; }
.missione-barra i { position: absolute; inset: 0 auto 0 0; width: var(--p); background: linear-gradient(90deg, var(--neon), #ff6b7d); border-radius: 999px; transition: width .5s; }
.missione.finita .missione-barra i { background: linear-gradient(90deg, #2fbf71, #6fe3a0); }
.missione-barra span { position: relative; display: block; text-align: center; font-size: .68rem; font-weight: 700; line-height: 14px; }
.missione > .btn, .missione-fatta, .missione-vuota { grid-column: 2; grid-row: 1 / span 2; }
.missione-fatta { color: #4be38a; font-weight: 800; font-size: 1.2rem; width: 30px; text-align: center; }
.missione.riscossa { opacity: .55; }
.missione-bonus { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .85rem; padding-top: 8px; border-top: 1px dashed var(--linea); color: var(--spento); }
.missione-bonus b { color: var(--testo); }
.oggi-sociale, .sfida-sociale { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.sfida-sociale { margin-bottom: 22px; }
.amici-invito { background: var(--asfalto); border: 1px solid var(--linea); border-radius: 16px; padding: 16px; display: grid; gap: 8px; align-content: center; justify-items: start; background-image: radial-gradient(120% 120% at 100% 0%, rgba(63, 216, 255, .12), transparent 60%); }
.amici-invito .nota { margin: 0; }
.boss-box { background: var(--asfalto); border: 1px solid color-mix(in srgb, var(--neon) 50%, var(--linea)); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; background-image: radial-gradient(120% 120% at 0% 0%, rgba(255, 46, 70, .16), transparent 60%); }
.boss-box.caduto { border-color: color-mix(in srgb, var(--oro) 60%, var(--linea)); background-image: radial-gradient(120% 120% at 0% 0%, rgba(242, 193, 78, .16), transparent 60%); }
.boss-testa { display: flex; gap: 12px; align-items: center; }
.boss-testa img { width: 62px; aspect-ratio: 5 / 7; object-fit: cover; border-radius: 8px; border: 2px solid var(--neon); box-shadow: 0 0 16px var(--neon-alone); flex: none; }
.boss-box.caduto .boss-testa img { filter: grayscale(.8); border-color: var(--oro); }
.boss-testa > div { display: grid; gap: 4px; flex: 1; min-width: 0; }
.boss-etichetta { color: var(--neon); font-weight: 700; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }
.boss-testa b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.boss-pv { position: relative; height: 18px; border-radius: 999px; background: var(--notte); border: 1px solid var(--linea); overflow: hidden; }
.boss-pv i { position: absolute; inset: 0 auto 0 0; width: var(--p); background: linear-gradient(90deg, #b3122a, var(--neon)); }
.boss-pv span { position: relative; display: block; text-align: center; font-size: .72rem; font-weight: 700; line-height: 16px; }
.boss-azioni { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.boss-azioni .nota, .boss-box > .nota { margin: 0; }
.boss-classifica { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .85rem; }
.boss-classifica li { display: flex; align-items: center; gap: 8px; }
.boss-classifica li span { width: 18px; color: var(--spento); font-weight: 700; text-align: right; }
.boss-classifica li b { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.boss-classifica li em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--oro); }
.boss-classifica li.io b { color: var(--neon); }
.amici-modale { display: grid; gap: 12px; }
.amici-modale h2 { margin: 0; }
.amici-modale .nota { margin: 0; }
.amici-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 55vh; overflow-y: auto; }
.amici-lista li { display: flex; align-items: center; gap: 10px; background: var(--asfalto); border: 1px solid var(--linea); border-radius: 12px; padding: 8px 10px; }
.amico-info { flex: 1; display: grid; min-width: 0; }
.amico-info small { color: var(--spento); }
.vinto-tag { color: #4be38a; font-weight: 800; font-size: .8rem; }
.punti-amico { color: #4be38a; font-weight: 700; }
.punti-amico.perso { color: var(--spento); }
.fine.boss-fine b { color: var(--neon); }
@media (max-width: 560px) {
  .accessi-giorni { gap: 4px; }
  .accessi-giorni li { padding: 5px 2px; min-height: 58px; }
  .accessi-giorni span { font-size: .6rem; }
}

/* ---------- Olografiche ---------- */
.carta.olo { box-shadow: 0 0 0 2px #fff6, 0 0 18px rgba(200, 110, 255, .55), 0 0 30px rgba(80, 190, 255, .35); }
.carta.olo::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: inherit;
  background: linear-gradient(115deg, transparent 20%, rgba(255, 80, 120, .28) 30%, rgba(255, 210, 90, .26) 38%, rgba(90, 255, 170, .26) 46%, rgba(80, 190, 255, .28) 54%, rgba(200, 110, 255, .28) 62%, transparent 72%);
  background-size: 300% 300%; mix-blend-mode: color-dodge; animation: olo-scorre 4.5s ease-in-out infinite; }
.carta.olo.mini::before { content: "✦"; position: absolute; z-index: 4; top: 3px; right: 4px; color: #fff; font-size: .6rem; text-shadow: 0 0 6px #c86eff, 0 0 12px #50beff; pointer-events: none; }
.olo-scritta, .carta.olo .carta-nome { background: linear-gradient(90deg, #ff7a9a, #ffd25a, #6fffb8, #6ccaff, #d08cff, #ff7a9a); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: olo-testo 4s linear infinite; }
.olo-scritta { font-weight: 800; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 2px; filter: drop-shadow(0 0 4px rgba(200, 110, 255, .55)); }
.carta.olo .carta-nome { filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .6)) drop-shadow(0 0 6px rgba(108, 202, 255, .35)); }
.carta.piccola .olo-scritta { font-size: .52rem; letter-spacing: .1em; margin-bottom: 1px; }
@keyframes olo-testo { to { background-position: 200% 0; } }
@media (prefers-reduced-motion: reduce) { .olo-scritta, .carta.olo .carta-nome { animation: none; } }
@keyframes olo-scorre { 0% { background-position: 100% 100%; } 50% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }
@media (prefers-reduced-motion: reduce) { .carta.olo::after { animation: none; background-position: 50% 50%; } }
.etichetta.olo-tag { background: linear-gradient(90deg, #ff5078, #ffd25a, #5affaa, #50beff, #c86eff); color: #1a0f16; text-shadow: none; box-shadow: 0 0 14px rgba(200, 110, 255, .7); }
.olo-testo { background: linear-gradient(90deg, #ff7a9a, #ffd25a, #6fffb8, #6ccaff, #d08cff); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
.olo-nota { margin: 0; padding: 8px 10px; border-radius: 10px; font-size: .85rem; background: linear-gradient(110deg, rgba(255, 80, 120, .14), rgba(80, 190, 255, .14), rgba(200, 110, 255, .14)); border: 1px solid rgba(200, 110, 255, .4); }

/* ---------- Schede dell'album, trofei, scambi ---------- */
.schede-album { display: flex; gap: 6px; margin: 0 0 16px; padding: 4px; background: var(--asfalto); border: 1px solid var(--linea); border-radius: 999px; width: fit-content; max-width: 100%; }
.scheda { position: relative; background: none; border: 0; color: var(--spento); font: inherit; font-weight: 700; padding: 8px 18px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s; }
.scheda.sel { background: var(--neon); color: #fff; box-shadow: 0 0 14px var(--neon-alone); }
.scheda .badge { position: absolute; top: -4px; right: -2px; }
.titolo-scelto { margin: -4px 0 14px; color: var(--spento); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.titolo-scelto b { color: var(--oro); }
.trofei { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.trofeo { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; background: var(--asfalto); border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; }
.trofeo-icona { font-size: 1.6rem; text-align: center; filter: grayscale(1); opacity: .55; }
.trofeo.pronto { border-color: color-mix(in srgb, var(--oro) 65%, var(--linea)); box-shadow: 0 0 18px rgba(242, 193, 78, .18); }
.trofeo.pronto .trofeo-icona { filter: none; opacity: 1; color: var(--oro); text-shadow: 0 0 12px var(--oro); }
.trofeo.preso .trofeo-icona { filter: none; opacity: 1; }
.trofeo-testo { display: grid; gap: 4px; min-width: 0; }
.trofeo-testo b { font-size: .95rem; }
.trofeo-testo small { color: var(--spento); font-size: .78rem; }
.trofeo-testo .trofeo-premio { color: var(--oro); opacity: .85; }
.trofeo.preso .missione-barra i { background: linear-gradient(90deg, #2fbf71, #6fe3a0); }
.titolo-giocatore { display: block; color: var(--oro); font-size: .72rem; font-weight: 700; letter-spacing: .04em; margin-top: 1px; }
.classifica td.chi .titolo-giocatore { margin-top: 2px; line-height: 1.2; }
.scambi-titolo { margin: 18px 0 8px; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
.badge-in { background: var(--neon); color: #fff; border-radius: 999px; font-size: .72rem; padding: 1px 8px; }
.scambi { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.scambio-riga { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "chi azioni" "coppia coppia" "nomi nomi"; gap: 8px 10px; background: var(--asfalto); border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; }
.scambi.vecchi .scambio-riga { opacity: .7; }
.scambio-chi { grid-area: chi; display: grid; }
.scambio-chi small { color: var(--spento); font-size: .78rem; }
.scambio-azioni { grid-area: azioni; display: flex; gap: 6px; align-items: center; }
.scambio-stato { font-size: .8rem; font-weight: 700; color: var(--spento); }
.scambio-riga.accettato .scambio-stato { color: #4be38a; }
.scambio-coppia { grid-area: coppia; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; justify-items: center; }
.scambio-coppia .carta { width: 76px; }
.scambio-coppia > span, .scambio-freccia { font-size: 1.5rem; color: var(--oro); }
.scambio-nomi { grid-area: nomi; display: grid; grid-template-columns: 1fr 1fr; text-align: center; font-size: .8rem; gap: 30px; }
.scambio-nomi small { color: var(--spento); }
.scambio-griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; max-height: 52vh; overflow-y: auto; padding: 4px; }
.scambio-carta { background: none; border: 2px solid transparent; border-radius: 14px; padding: 4px; display: grid; gap: 4px; justify-items: center; color: var(--spento); font: inherit; font-size: .72rem; cursor: pointer; transition: border-color .15s, transform .15s; }
.scambio-carta:hover, .scambio-carta:focus-visible { border-color: var(--oro); transform: translateY(-2px); }
.scambio-carta .carta { width: 100%; pointer-events: none; }
.scambio-riepilogo { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; justify-items: center; }
.scambio-riepilogo > div { display: grid; gap: 6px; justify-items: center; width: 100%; max-width: 130px; }
.scambio-riepilogo small { color: var(--spento); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .7rem; }
.scambio-riepilogo .carta { width: 100%; }
.scambio-ricevuta { width: 150px; margin: 0 auto; }
@media (max-width: 560px) {
  .trofei { grid-template-columns: 1fr; }
  .scheda { padding: 8px 14px; }
  .scambio-coppia .carta { width: 64px; }
}

/* ---------- Controlli admin ---------- */
.controlli { display: grid; gap: 10px; margin-top: 10px; }
.controllo { background: var(--notte); border: 1px solid var(--linea); border-left: 4px solid var(--linea); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.controllo.medio { border-left-color: var(--oro); }
.controllo.grave { border-left-color: var(--neon); box-shadow: 0 0 16px rgba(255, 46, 70, .12); }
.controllo-testa { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.controllo-livello { font-size: .75rem; font-weight: 700; color: var(--spento); }
.controllo.grave .controllo-livello { color: var(--neon); }
.controllo.medio .controllo-livello { color: var(--oro); }
.controllo ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: .85rem; line-height: 1.4; }
.controllo li small { color: var(--spento); margin-right: 4px; }
.controllo li.g0 { color: var(--spento); }
.controllo .azioni { margin: 0; }

/* ---------- Graffiti ---------- */
.graffito-pannello { display: grid; grid-template-columns: 150px 1fr auto; gap: 14px; align-items: center; background: var(--asfalto); border: 1px solid color-mix(in srgb, var(--c, var(--neon)) 45%, var(--linea)); border-radius: 16px; padding: 12px 16px; margin-bottom: 18px; background-image: radial-gradient(120% 140% at 0% 50%, color-mix(in srgb, var(--c, var(--neon)) 16%, transparent), transparent 60%); }
.graffito-pannello.vuoto { grid-template-columns: 1fr auto; }
.graffito-pannello.vuoto > div { display: grid; gap: 4px; }
.graffito-pannello img { width: 150px; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .5)); }
.graffito-info { display: grid; gap: 3px; min-width: 0; }
.graffito-info small { color: var(--spento); font-weight: 700; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }
.graffito-info b { font-size: 1.05rem; }
.graffito-info .nota { margin: 0; }
.graffito-liv { display: inline-block; font-size: .72rem; font-weight: 800; color: var(--c, var(--oro)); border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px; vertical-align: 2px; }
.graffito-azioni { display: grid; gap: 6px; justify-items: stretch; }
.graffiti-riga { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
.graffito-chip { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.graffito-chip small { opacity: .8; }
.graffito-chip.nemico { border-style: dashed; }
.graffiti-modale { display: grid; gap: 12px; }
.graffiti-modale h2 { margin: 0; }
.graffiti-modale .nota { margin: 0; }
.graffiti-griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; max-height: 58vh; overflow-y: auto; padding: 2px; }
.graffito-carta { position: relative; display: grid; gap: 4px; justify-items: center; text-align: center; background: var(--asfalto); border: 2px solid var(--linea); border-radius: 14px; padding: 10px 8px; color: var(--testo); font: inherit; cursor: pointer; transition: border-color .15s, transform .15s; }
.graffito-carta:hover { transform: translateY(-2px); border-color: var(--c); }
.graffito-carta.sel { border-color: var(--c); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 40%, transparent); }
.graffito-carta img { width: 100%; }
.graffito-carta small { color: var(--spento); font-size: .74rem; line-height: 1.3; }
.graffito-inuso { font-size: .72rem; font-weight: 800; color: var(--c); }
.graffito-carta.bloccato { cursor: default; opacity: .6; }
.graffito-ombra { width: 100%; aspect-ratio: 2 / 1; display: grid; place-items: center; font-family: var(--display); font-size: 2rem; color: var(--spento); border: 2px dashed var(--linea); border-radius: 10px; }
.graffito-carta.r-rara { box-shadow: inset 0 0 0 1px rgba(76, 149, 255, .25); }
.graffito-carta.r-epica { box-shadow: inset 0 0 0 1px rgba(184, 102, 255, .35); }
.graffiti-rivela { display: grid; gap: 14px; text-align: center; }
.graffiti-rivela .codice-tag { justify-self: center; }
.graffiti-usciti { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.graffiti-usciti.uno { grid-template-columns: minmax(0, 320px); justify-content: center; }
.graffito-uscito { display: grid; gap: 4px; justify-items: center; animation: spruzza .6s cubic-bezier(.2, .9, .3, 1.3) both; animation-delay: calc(var(--i) * 120ms); }
.graffito-uscito img { width: 100%; filter: drop-shadow(0 0 12px color-mix(in srgb, var(--c) 50%, transparent)); }
.graffito-uscito small { color: var(--oro); font-weight: 700; }
@keyframes spruzza { from { opacity: 0; transform: scale(.4) rotate(-8deg); filter: blur(6px); } }
.bomboletta-ico { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; gap: 0; }
.bomboletta-ico img { width: 100%; margin: 0 -10%; }
.form-graffiti { display: grid; gap: 10px; }
.graffito-admin { display: grid; grid-template-columns: 170px 1fr; gap: 12px; align-items: center; border: 1px solid var(--linea); border-radius: 12px; padding: 10px 12px; margin: 0; }
.graffito-anteprima { width: 170px; }
.campi-graffito { display: grid; gap: 6px; }
.campi-graffito label { display: grid; gap: 3px; font-size: .8rem; color: var(--spento); }
.campi-graffito input:not([type=color]) { background: var(--notte); border: 1px solid var(--linea); border-radius: 8px; padding: 8px 10px; color: var(--testo); font: inherit; width: 100%; }
.campi-graffito input[type=color] { width: 100%; height: 38px; border: 1px solid var(--linea); border-radius: 8px; background: var(--notte); padding: 2px; }
@media (max-width: 560px) {
  .graffito-pannello { grid-template-columns: 110px 1fr; }
  .graffito-pannello img { width: 110px; }
  .graffito-azioni { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; }
  .graffiti-griglia { grid-template-columns: repeat(2, 1fr); }
  .graffito-admin { grid-template-columns: 1fr; }
  .graffito-anteprima { width: 200px; justify-self: center; }
}

/* ---------- Graffiti: bozza, emoji, immagini ---------- */
.graffito-pannello img, .graffito-carta img, .graffito-uscito img, .graffito-anteprima, .bomboletta-ico img { aspect-ratio: 2 / 1; object-fit: contain; }
.stato-bozza { margin: 0 0 4px; padding: 8px 12px; border-radius: 10px; font-size: .85rem; color: var(--spento); background: var(--notte); border: 1px solid var(--linea); }
.stato-bozza.attiva { color: var(--testo); border-color: color-mix(in srgb, var(--oro) 60%, var(--linea)); background: rgba(242, 193, 78, .08); }
.stato-bozza.attiva b { color: var(--oro); }
.graffito-admin.modificato { border-color: color-mix(in srgb, var(--oro) 60%, var(--linea)); }
.graffito-admin.carico { opacity: .55; pointer-events: none; }
.graffito-anteprima-box { position: relative; }
.graffito-anteprima-box .chip { position: absolute; top: 0; left: 0; background: var(--oro); color: #1b1206; border-color: var(--oro); }
.graffito-img-azioni { display: flex; flex-wrap: wrap; gap: 6px; }
.emoji-campo { display: block; }
.emoji-btn { width: 100%; justify-content: center; gap: 8px; padding: 6px 10px; }
.emoji-btn span { font-size: 1.4rem; line-height: 1; }
.emoji-scelta { display: grid; gap: 10px; }
.emoji-scelta h2 { margin: 0; }
.emoji-cerca { background: var(--notte); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; color: var(--testo); font: inherit; width: 100%; }
.emoji-cerca:focus { outline: none; border-color: var(--oro); }
.emoji-schede { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.emoji-schede button, .emoji-griglia button { background: none; border: 1px solid transparent; border-radius: 10px; cursor: pointer; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.emoji-scheda { font-size: 1.3rem; padding: 6px 7px; opacity: .6; }
.emoji-scheda.sel { opacity: 1; border-color: var(--oro); background: rgba(242, 193, 78, .1); }
.emoji-recenti { display: inline-flex; gap: 2px; padding-right: 8px; margin-right: 4px; border-right: 1px solid var(--linea); }
.emoji-recenti button { font-size: 1.2rem; padding: 4px; }
.emoji-griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 2px; max-height: 50vh; overflow-y: auto; padding: 2px; }
.emoji-griglia button { font-size: 1.7rem; padding: 6px 0; transition: transform .1s, background .1s; }
.emoji-griglia button:hover, .emoji-griglia button:focus-visible { background: var(--asfalto); border-color: var(--linea); transform: scale(1.15); }
@media (max-width: 560px) { .emoji-griglia { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); } .emoji-griglia button { font-size: 1.5rem; } }

/* ---------- Graffiti: squadra e negozio ---------- */
.graffito-squadra { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; align-items: center; margin: 12px 0 4px; padding: 10px 14px; background: var(--asfalto); border: 1px solid color-mix(in srgb, var(--c, var(--linea)) 45%, var(--linea)); border-radius: 14px; background-image: radial-gradient(120% 140% at 0% 50%, color-mix(in srgb, var(--c, transparent) 14%, transparent), transparent 60%); }
.graffito-squadra.vuoto { grid-template-columns: 1fr auto; border-style: dashed; }
.graffito-squadra img { width: 120px; aspect-ratio: 2 / 1; object-fit: contain; }
.graffito-squadra .nota { margin: 0; font-size: .82rem; }
.graffiti-vetrina { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.prodotto-graffito .btn { white-space: nowrap; padding-left: 12px; padding-right: 12px; }
.prodotto-graffito .graffito-vetrina-img { width: 100%; aspect-ratio: 2 / 1; object-fit: contain; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--c) 35%, transparent)); }
@media (max-width: 560px) {
  .graffito-squadra { grid-template-columns: 90px 1fr; }
  .graffito-squadra img { width: 90px; }
  .graffito-squadra .btn { grid-column: 1 / -1; }
  .graffiti-vetrina { grid-template-columns: repeat(2, 1fr); }
}

/* ---------- Zaino ---------- */
.oggetto-ico { --c: var(--neon); position: relative; display: inline-grid; place-items: center; width: 52px; aspect-ratio: 1; flex: none; border-radius: 16px; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 28%, #1a1218), #0d090c 75%); border: 2px solid var(--c); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 10px color-mix(in srgb, var(--c) 35%, transparent); animation: neon-oggetto 4s ease-in-out infinite; }
.oggetto-ico i { font-style: normal; font-size: 1.7rem; line-height: 1; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--c) 70%, transparent)); font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.oggetto-ico::after { content: ""; position: absolute; inset: 4px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); pointer-events: none; }
.oggetto-ico.grande { width: 84px; border-radius: 22px; }
.oggetto-ico.grande i { font-size: 2.8rem; }
.oggetto-ico.piccola { width: 34px; border-radius: 10px; border-width: 1.5px; }
.oggetto-ico.piccola i { font-size: 1.1rem; }
.oggetto-ico.piccola::after { inset: 3px; border-radius: 7px; }
.oggetto-ico.vuoto { --c: var(--linea); border-style: dashed; box-shadow: none; animation: none; background: none; }
.oggetto-ico.vuoto i { color: var(--spento); font-size: 1.4rem; filter: none; }
@keyframes neon-oggetto { 0%, 100% { filter: none; } 47% { filter: none; } 48% { filter: brightness(.6); } 49% { filter: none; } 51% { filter: brightness(.75); } 52% { filter: none; } }
@media (prefers-reduced-motion: reduce) { .oggetto-ico { animation: none; } }
.prima-partita { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 18px; }
.prima-partita .graffito-pannello { margin-bottom: 0; }
.zaino-pannello { background: var(--asfalto); border: 1px solid var(--linea); border-radius: 16px; padding: 12px 16px; display: grid; gap: 10px; background-image: radial-gradient(120% 140% at 100% 0%, rgba(63, 216, 255, .1), transparent 60%); }
.zaino-testa { display: grid; gap: 2px; }
.zaino-testa .nota { margin: 0; font-size: .8rem; }
.zaino-posti { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.zaino-posto { display: grid; justify-items: center; gap: 4px; text-align: center; background: var(--notte); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 6px; color: var(--testo); font: inherit; cursor: pointer; transition: border-color .15s, transform .15s; }
.zaino-posto:hover { border-color: var(--c, var(--oro)); transform: translateY(-2px); }
.zaino-posto b { font-size: .78rem; line-height: 1.15; }
.zaino-posto small { font-size: .7rem; color: var(--spento); }
.zaino-posto.finito { opacity: .5; }
.zaino-posto.finito small { color: var(--neon); }
.zaino-modale { display: grid; gap: 12px; }
.zaino-modale h2 { margin: 0; }
.zaino-modale .nota { margin: 0; }
.zaino-scelta { display: grid; gap: 8px; max-height: 55vh; overflow-y: auto; }
.zaino-opzione { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--asfalto); border: 2px solid var(--linea); border-radius: 14px; padding: 10px 12px; color: var(--testo); font: inherit; cursor: pointer; }
.zaino-opzione:hover, .zaino-opzione.sel { border-color: var(--c); }
.zaino-opzione small { color: var(--spento); font-size: .78rem; }
.zaino-opzione .ne-hai-2 { color: var(--c); font-weight: 800; }
.zaino-vetrina .prodotto { gap: 8px; }
.zaino-riga { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 2px 0 8px; }
.zaino-etichetta { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--spento); margin-right: 2px; }
.zaino-usa { display: inline-flex; align-items: center; gap: 7px; background: var(--asfalto); border: 1px solid color-mix(in srgb, var(--c) 55%, var(--linea)); border-radius: 12px; padding: 4px 10px 4px 4px; color: var(--testo); font: inherit; cursor: pointer; text-align: left; transition: transform .12s, box-shadow .12s; }
.zaino-usa:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 40%, transparent); }
.zaino-usa b { display: block; font-size: .76rem; line-height: 1.1; }
.zaino-usa small { display: block; font-size: .68rem; color: var(--spento); }
.zaino-usa:disabled { opacity: .55; cursor: default; }
.zaino-usa.usato { opacity: .3; }
.zaino-nota { font-size: .7rem; color: var(--spento); }
.graffiti-riga { display: grid; gap: 4px; margin: 0 0 8px; }
.graffito-riga-b { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.graffito-riga-b .graffito-chip { flex: none; }
.graffito-riga-b > small { font-size: .72rem; color: var(--spento); line-height: 1.3; flex: 1; min-width: 150px; }
.graffito-riga-b.annullati > small { color: var(--oro); }
@media (max-width: 560px) {
  .prima-partita { grid-template-columns: 1fr; }
  .zaino-usa { padding-right: 8px; }
  .zaino-usa b { font-size: .7rem; }
}

/* ---------- Finestra del premio di accesso ---------- */
.accesso-pop { display: grid; gap: 12px; text-align: center; }
.accesso-pop h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.6rem; text-shadow: 0 0 14px rgba(242, 193, 78, .5); }
.accesso-pop .codice-tag { justify-self: center; }
.accesso-pop .nota { margin: 0; }
.accesso-pop .accessi-giorni li { min-height: 70px; }
.accesso-pop .accessi-giorni li.oggi-qui { transform: scale(1.06); }
.accesso-pop .btn.grande { font-size: 1.05rem; padding: 12px 22px; }
.accesso-dopo { justify-self: center; background: none; border-color: transparent; color: var(--spento); }

/* ---------- Tutorial ---------- */
#tutorial { position: fixed; inset: 0; z-index: 29; pointer-events: none; }
#tutorial .tut-velo { position: absolute; inset: 0; pointer-events: auto; }
#tutorial.da-fare .tut-velo { pointer-events: none; }
#tutorial .tut-buco { position: absolute; border-radius: 14px; border: 2px solid var(--neon); box-shadow: 0 0 0 9999px rgba(5, 3, 6, .72), 0 0 22px var(--neon-alone), inset 0 0 18px var(--neon-alone); transition: top .35s cubic-bezier(.2,.8,.2,1), left .35s cubic-bezier(.2,.8,.2,1), width .35s cubic-bezier(.2,.8,.2,1), height .35s cubic-bezier(.2,.8,.2,1); animation: tut-pulsa 1.8s ease-in-out infinite; pointer-events: none; }
#tutorial.da-fare .tut-buco { border-color: var(--oro); box-shadow: 0 0 0 9999px rgba(5, 3, 6, .5), 0 0 26px rgba(242, 193, 78, .55), inset 0 0 18px rgba(242, 193, 78, .35); }
#tutorial.senza-buco .tut-buco { width: 0 !important; height: 0 !important; top: 50% !important; left: 50% !important; border: 0; }
#tutorial .tut-bolla { position: absolute; width: min(380px, calc(100vw - 20px)); background: linear-gradient(160deg, #2b1f29, var(--asfalto)); border: 1px solid var(--linea); border-top: 3px solid var(--neon); border-radius: 16px; padding: 14px 16px 12px; color: var(--testo); box-shadow: 0 18px 50px rgba(0, 0, 0, .65); pointer-events: auto; transition: top .35s cubic-bezier(.2,.8,.2,1), left .35s cubic-bezier(.2,.8,.2,1); }
#tutorial.da-fare .tut-bolla { border-top-color: var(--oro); }
#tutorial .tut-bolla.tut-entra { animation: tut-entra .35s cubic-bezier(.2,.9,.3,1.2); }
.tut-testa { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.tut-testa b { font-family: "Bungee", Impact, sans-serif; font-weight: 400; font-size: 1.05rem; letter-spacing: .02em; color: var(--testo); text-shadow: 0 0 12px var(--neon-alone); }
.tut-testa small { color: var(--spento); font-size: .78rem; white-space: nowrap; }
.tut-bolla p { margin: 0 0 8px; line-height: 1.45; font-size: .95rem; }
.tut-nota { color: var(--spento); font-size: .85rem; }
.tut-compito { color: var(--oro); font-weight: 600; font-size: .85rem !important; }
.tut-conta { color: var(--oro); font-weight: 700; }
.tut-su { color: #4be38a; }
.tut-bolla .r-comune { color: var(--r-comune); } .tut-bolla .r-rara { color: var(--r-rara); } .tut-bolla .r-epica { color: var(--r-epica); } .tut-bolla .r-leggendaria { color: var(--oro); }
.tut-azioni { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.tut-azioni .tut-esci { margin-right: auto; background: transparent; border-color: transparent; color: var(--spento); }
@keyframes tut-entra { from { opacity: 0; transform: translateY(8px) scale(.97); } }
@keyframes tut-pulsa { 50% { outline: 4px solid rgba(255, 46, 70, .22); outline-offset: 3px; } }
@media (prefers-reduced-motion: reduce) { #tutorial .tut-buco, #tutorial .tut-bolla { transition: none; animation: none; } }

/* ---------- online: amici connessi e sfide dal vivo ---------- */
.pallino-online { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 0 rgba(61, 220, 132, .7); animation: pulsa-online 2s infinite; margin-right: 6px; vertical-align: middle; flex: none; }
@keyframes pulsa-online { 0% { box-shadow: 0 0 0 0 rgba(61, 220, 132, .6); } 70% { box-shadow: 0 0 0 7px rgba(61, 220, 132, 0); } 100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0); } }
.amici-online { background: var(--asfalto); border: 1px solid var(--linea); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; display: grid; gap: 10px; background-image: radial-gradient(120% 120% at 0% 0%, rgba(61, 220, 132, .12), transparent 60%); }
.online-testa { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; }
.amici-online .amici-lista { max-height: none; }
.amici-online .amici-lista li { background: rgba(0, 0, 0, .18); }
.sfida-celle { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.invito-vivo { display: grid; justify-items: center; text-align: center; gap: 10px; }
.invito-vivo h2 { margin: 0; }
.invito-anello { width: 92px; height: 92px; border-radius: 50%; display: grid; place-content: center; text-align: center; border: 3px solid #3ddc84; box-shadow: 0 0 22px rgba(61, 220, 132, .35), inset 0 0 14px rgba(61, 220, 132, .25); animation: respira 1.6s infinite; }
.invito-anello b { font-size: 2rem; line-height: 1; font-family: var(--display); }
.invito-anello small { color: var(--spento); font-size: .72rem; }
.invito-anello.piccolo { width: 66px; height: 66px; }
.invito-anello.piccolo b { font-size: 1.4rem; }
.vivo-tempo { display: block; height: 5px; margin-top: 6px; border-radius: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.vivo-tempo i { display: block; height: 100%; background: #3ddc84; transition: width .5s linear; } .vivo-tempo.poco i { background: #ff4d5e; }
.vivo-banner { margin: 0 0 8px; padding: 7px 12px; border-radius: 10px; background: rgba(61, 220, 132, .1); border: 1px solid rgba(61, 220, 132, .35); font-size: .9rem; text-align: center; }
.vivo-banner b { color: #3ddc84; }
.vivo-banner .vivo-allarme, .vivo-allarme { color: #ff5a6a !important; }
.vivo-attesa { display: grid; justify-items: center; gap: 6px; padding: 18px 10px; text-align: center; }
.vivo-attesa p { margin: 0; color: var(--spento); }
.vivo-attesa p b { color: var(--testo); }
.vivo-puntini { display: inline-flex; gap: 6px; }
.vivo-puntini i { width: 9px; height: 9px; border-radius: 50%; background: #3ddc84; animation: puntino 1.2s infinite; }
.vivo-puntini i:nth-child(2) { animation-delay: .2s; } .vivo-puntini i:nth-child(3) { animation-delay: .4s; }
@keyframes puntino { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .pallino-online, .invito-anello, .vivo-puntini i { animation: none; } }

/* ---------- scheda veloce di una carta (dalla bustina aperta) ---------- */
.scheda-veloce { position: fixed; inset: 0; z-index: 40; background: rgba(5, 3, 4, .78); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; overflow-y: auto; animation: dissolvi .2s ease-out; }
.scheda-box { position: relative; width: min(460px, 100%); background: var(--asfalto); border: 1px solid var(--linea); border-radius: 18px; padding: 18px 16px 14px; display: grid; gap: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .55); animation: sale-su .25s ease-out; }
@keyframes sale-su { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.scheda-x { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--linea); background: rgba(0, 0, 0, .3); color: var(--testo); font-size: 1rem; cursor: pointer; }
.scheda-testa { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; }
.scheda-carta .carta { width: 112px; }
.scheda-testa h2 { margin: 2px 0 4px; }
.scheda-testa .serie-nome, .scheda-testa .nota { margin: 0; }
.scheda-box .mosse-lista { margin: 0; }
.scheda-box .mosse-lista li { display: grid; grid-template-columns: 38px 1fr; column-gap: 8px; align-items: center; }
.scheda-box .mosse-lista li .costo { grid-row: span 2; text-align: center; }
.scheda-box .nota.centro { margin: 0; text-align: center; font-size: .8rem; }
.r-testo.r-rara { color: var(--r-rara); } .r-testo.r-epica { color: var(--r-epica); } .r-testo.r-leggendaria { color: var(--oro); } .r-testo.r-comune { color: var(--r-comune); }
.bonus-rarita { margin: 0; padding: 7px 10px; border-radius: 10px; font-size: .85rem; background: rgba(255, 255, 255, .05); border-left: 3px solid var(--r-comune); }
.bonus-rarita.r-rara { border-color: var(--r-rara); } .bonus-rarita.r-epica { border-color: var(--r-epica); } .bonus-rarita.r-leggendaria { border-color: var(--oro); }
.bonus-rarita.r-rara b { color: var(--r-rara); } .bonus-rarita.r-epica b { color: var(--r-epica); } .bonus-rarita.r-leggendaria b { color: var(--oro); }

.ordine-turno { margin: 0 0 8px; font-size: .82rem; color: var(--spento); text-align: center; }
.ordine-turno.mio b { color: #6fe3a0; } .ordine-turno.suo b { color: #ff7a8a; }

.albo { margin: 4px 0 12px; background: var(--asfalto); border: 1px solid var(--linea); border-radius: 12px; padding: 8px 12px; }
.albo summary { cursor: pointer; font-weight: 700; }
.albo ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.albo li { display: grid; gap: 2px; font-size: .88rem; }
.albo li small { color: var(--spento); }

.stat-griglia .potenziata { border: 1px solid currentColor; box-shadow: inset 0 0 14px color-mix(in srgb, currentColor 18%, transparent); }
.stat-griglia .potenziata span { color: inherit; font-weight: 700; }
.tipo-riga b { white-space: nowrap; }

/* badge "in squadra" sulle carte dell'album */
.cella { position: relative; }
.badge-squadra { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); z-index: 3; white-space: nowrap; pointer-events: none;
  font-size: .66rem; font-weight: 800; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px; background: #2a2330; color: var(--testo); border: 1px solid var(--linea); box-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
.badge-squadra.attiva { background: #6fe3a0; color: #0d1a12; border-color: #6fe3a0; }

/* admin: oggetti dello zaino */
.zaino-admin { display: grid; gap: 12px; }
.zaino-admin-riga { border: 1px solid var(--linea); border-left: 3px solid var(--c); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; margin: 0; }
.zaino-admin-riga legend { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 0 6px; }
.zaino-admin label { display: grid; gap: 4px; font-size: .82rem; color: var(--spento); }
.zaino-admin label.spunta { display: flex; align-items: center; gap: 8px; }
.zaino-admin input, .zaino-admin textarea { width: 100%; }
.zaino-admin input[type=color] { height: 38px; padding: 2px; }
.campi-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
.campo-emoji { font-size: 1.3rem; text-align: center; }
.campi-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; align-items: end; }
@media (max-width: 520px) { .campi-3, .campi-4 { grid-template-columns: 1fr 1fr; } }

/* ---------- reazioni in battaglia ---------- */
.reazioni { position: absolute; z-index: 6; right: 10px; top: calc(max(8px, env(safe-area-inset-top)) + 46px); display: grid; justify-items: end; gap: 8px; }
.reazioni-apri { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--linea); background: rgba(22, 17, 21, .92); font-size: 1.45rem; cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0, 0, 0, .45); }
.reazioni-apri.in-attesa span { opacity: .45; }
.reazioni-vassoio[hidden], .reazioni-giro[hidden] { display: none; }
.reazioni-giro { position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(#3fd8ff var(--p, 0%), transparent 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); pointer-events: none; }
.reazioni-vassoio { background: rgba(22, 17, 21, .96); border: 1px solid var(--linea); border-radius: 14px; padding: 8px; box-shadow: 0 10px 28px rgba(0, 0, 0, .55); width: min(270px, 74vw); max-height: 60vh; overflow-y: auto; display: grid; gap: 8px; animation: sale-su .18s ease-out; }
.reazioni-griglia { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.reazione { border: 1px solid transparent; background: rgba(255, 255, 255, .05); border-radius: 10px; font-size: 1.6rem; padding: 6px 0; cursor: pointer; color: var(--testo); display: grid; place-items: center; min-height: 48px; }
.reazione.frase { grid-column: span 2; font-size: .82rem; font-weight: 700; font-style: normal; padding: 9px 4px; }
.reazione img { width: 40px; height: 40px; object-fit: contain; }
.reazione:hover:not(:disabled) { border-color: var(--linea); background: rgba(255, 255, 255, .1); }
.reazione:disabled { opacity: .4; cursor: default; }
.reazioni-muto { border: 0; background: none; color: var(--spento); font-size: .78rem; cursor: pointer; padding: 2px; }
/* il fumetto: grande, sopra la carta di chi lo manda */
.fumetto-reazione { position: fixed; z-index: 30; pointer-events: none; font-size: 3.6rem; line-height: 1; padding: 12px 16px; border-radius: 22px; background: rgba(255, 255, 255, .96); color: #160f14; box-shadow: 0 10px 26px rgba(0, 0, 0, .5);
  animation: fumetto-pop .4s cubic-bezier(.3, 1.6, .5, 1) both; }
.fumetto-reazione.frase { font-size: 1.35rem; font-weight: 800; padding: 12px 18px; white-space: nowrap; }
.fumetto-reazione.immagine { padding: 8px; }
.fumetto-reazione img { width: 96px; height: 96px; object-fit: contain; display: block; }
.fumetto-reazione::after { content: ""; position: absolute; width: 16px; height: 16px; background: inherit; transform: rotate(45deg); left: calc(50% - 8px); bottom: -7px; }
.fumetto-reazione.sulla-carta { transform-origin: 50% 100%; translate: -50% -85%; }
.fumetto-reazione:not(.sulla-carta).lato-1 { left: min(330px, 60vw); top: calc(max(8px, env(safe-area-inset-top)) + 54px); }
.fumetto-reazione:not(.sulla-carta).lato-0 { left: 18px; bottom: calc(var(--basso, 0px) + 20px); }
.fumetto-reazione.via { transition: opacity .45s, scale .45s; opacity: 0; scale: .85; }
@keyframes fumetto-pop { from { scale: .2; opacity: 0; } to { scale: 1; opacity: 1; } }
/* tribuna: le reazioni degli spettatori */
